name: New case / boss proposal
description: Propose a new boss, puzzle, or dataset for an existing world.
labels: ["content"]
body:
  - type: dropdown
    id: world
    attributes:
      label: World
      options:
        - Ember Reach (World 1 — nulls, duplicates, casing, dtypes, outliers, dates)
        - Cryptara (World 2 — regex, extraction, encodings)
        - Geminora (World 3 — joins, relational)
        - Atlas Spire (World 4 — reshaping, pivoting, JSON)
        - Cinderforge (World 5 — performance, production-grade)
        - Lumenfield (World 6 — analysis: grouping, ranking, windows, cohorts)
        - Minos Deep (World 7 — CTEs, subqueries, recursion, set logic)
        - Chronopolis (World 8 — dates, time zones, timelines)
        - Helix-9 (World 9 — statistics, outliers, experiments)
    validations:
      required: true
  - type: textarea
    id: technique
    attributes:
      label: What technique does this case teach?
      description: e.g. "COALESCE vs fillna for imputation strategy" — see docs/content-authoring-guide.md
    validations:
      required: true
  - type: textarea
    id: dataset
    attributes:
      label: Dataset source & license
      description: Must be CC0, public-domain, or synthetic. Scraped/unclear-provenance data will not be accepted.
    validations:
      required: true
